[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccerhub"
version = "0.1.0"
description = "Unified fetch layer for open-source soccer data"
requires-python = ">=3.10"
dependencies = [
    "soccerdata>=1.8",
    "kloppy>=3.15",
    "mcp>=1.2",
    "pandas>=2.0",
    "pyarrow>=14",
    "supabase>=2",
    "google-genai>=1.9",
    "socceraction>=1.5",
    "multimethod<1.11",  # pandera 0.17 (via socceraction) breaks on multimethod 2.x
    "statsbombpy",
    "xgboost>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]
