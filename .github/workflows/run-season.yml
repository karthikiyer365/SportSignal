name: run-season

# ── cadence: edit this ONE line to change schedule ──
# Mon + Thu 06:00 UTC
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  transfers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "Soccer Data Hub"
      - name: refresh transfers table
        working-directory: Soccer Data Hub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          from soccerhub import push_transfers
          print(push_transfers(force=True))
          "

  matches:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        league:
          - "ENG-Premier League"
          - "ESP-La Liga"
          - "GER-Bundesliga"
          - "ITA-Serie A"
          - "FRA-Ligue 1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "Soccer Data Hub"
      - name: refresh match results (plain CSV — no scraping, safe in parallel)
        working-directory: Soccer Data Hub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEAGUE: ${{ matrix.league }}
        run: |
          python -c "
          import os
          from soccerhub import current_season, push_matches
          print(push_matches(os.environ['LEAGUE'], os.environ.get('SEASON') or current_season(), force=True))
          "

  club-elo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "Soccer Data Hub"
      - name: snapshot today's club Elo ratings
        working-directory: Soccer Data Hub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          from soccerhub import push_club_elo
          from soccerhub.errors import SoccerhubError
          # A dead upstream must not fail the run — the Elo snapshot is daily, one gap is
          # harmless. Only fetch errors are tolerated; anything else still fails loudly.
          try:
              print(push_club_elo(force=True))
          except SoccerhubError as exc:
              print(f'::warning title=club-elo skipped::{exc}')
          "

